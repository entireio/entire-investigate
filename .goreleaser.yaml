version: 2
project_name: entire-investigate

builds:
  - main: ./cmd/entire-investigate
    binary: entire-investigate
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

# Asset shape consumed by `entire plugin install`:
#   entire-investigate_<version>_<os>_<arch>.tar.gz (zip on Windows) + checksums.txt
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
